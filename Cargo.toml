[workspace]
resolver = "3"
members = ["crates/printdex-core", "crates/printdex-cli", "crates/printdex-app", "crates/printdex-mesh", "crates/printdex-render"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.94"
repository = "https://github.com/wolfedme/printdex"

[workspace.dependencies]
printdex-core = { path = "crates/printdex-core" }
printdex-mesh = { path = "crates/printdex-mesh" }
printdex-render = { path = "crates/printdex-render" }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "signal", "fs", "time"] }
tokio-util = "0.7"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
trash = "5"
sysinfo = { version = "0.40", default-features = false, features = ["disk"] }
rayon = "1.12"
sqlx = { version = "0.9.1", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate", "uuid"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
uuid = { version = "1", features = ["v7"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
clap = { version = "4", features = ["derive"] }
fastrand = "2"
dunce = "1"
tempfile = "3"
iced = { version = "0.14", features = ["tokio", "svg", "image-without-codecs", "advanced", "markdown"] }
fluent-bundle = "0.16"
unic-langid = { version = "0.9", features = ["macros"] }
rfd = "0.15"
toml = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
velopack = { version = "=1.3.39-g8d2844f", features = ["public-utils"] }
minisign-verify = "0.3"
jiff = "1"
opener = { version = "0.9", features = ["reveal"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
glam = "0.25"
# Same major version as iced 0.14, so one wgpu is built.
wgpu = "27"
pollster = "0.4"
rustic_core = { version = "0.14", default-features = false }
rustic_backend = { version = "0.8", default-features = false }
# Only the services Printdex offers (rustic_backend's own OpenDAL feature
# pulls in two dozen). SFTP is added per target in printdex-core.
opendal = { version = "0.59", default-features = false, features = ["blocking", "http-transport-reqwest", "executors-tokio", "layers-retry", "layers-throttle", "services-s3", "services-webdav"] }
bytes = "1"
keyring = "4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Backup crypto and compression are unbearably slow unoptimised (opening a
# repository runs scrypt), so tests and dev builds optimise them.
[profile.dev.package]
scrypt = { opt-level = 3 }
salsa20 = { opt-level = 3 }
pbkdf2 = { opt-level = 3 }
sha2 = { opt-level = 3 }
aes = { opt-level = 3 }
poly1305 = { opt-level = 3 }
zstd-sys = { opt-level = 3 }
rustic_cdc = { opt-level = 3 }

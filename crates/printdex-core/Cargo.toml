[package]
name = "printdex-core"
description = "UI-free engine for Printdex: libraries, scanning, database and search."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
directories.workspace = true
fastrand.workspace = true
image.workspace = true
notify.workspace = true
printdex-mesh.workspace = true
printdex-render.workspace = true
dunce.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
sysinfo.workspace = true
trash.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
zip.workspace = true
uuid.workspace = true
xxhash-rust.workspace = true
rustic_core.workspace = true
rustic_backend.workspace = true
opendal.workspace = true
bytes.workspace = true
keyring.workspace = true
scrypt.workspace = true
chacha20poly1305.workspace = true
zstd.workspace = true
gethostname.workspace = true

[target.'cfg(unix)'.dependencies]
opendal = { workspace = true, features = ["services-sftp"] }
# fsx::rename_no_replace: renameat2(RENAME_NOREPLACE) / renameatx_np(RENAME_EXCL).
rustix = { version = "1", features = ["fs"] }

[features]
# Turns on fsx::faults::arm so integration tests can fail or interfere with
# the n-th file operation under a folder. Never enabled in release builds.
fault-injection = []

[dev-dependencies]
# Itself, with fault injection on, for tests/it.
printdex-core = { path = ".", features = ["fault-injection"] }
tempfile.workspace = true

[lints]
workspace = true

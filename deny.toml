# cargo-deny configuration. Printdex is GPL-3.0-only, so every dependency
# must carry a GPL-3.0-compatible license.

[graph]
all-features = false

[advisories]
# Defaults: vulnerabilities and unsound crates are errors.
ignore = [
    # SQLite < 3.54 can return stale page-cache memory when a database is
    # opened next to a crafted `-wal` file with a different page size. Needs
    # local write access to Printdex's own data folder. The fix ships in
    # libsqlite3-sys 0.39, which sqlx 0.9.0 does not allow yet (<0.38).
    # Remove this once sqlx accepts libsqlite3-sys >= 0.39 (issue #23).
    { id = "RUSTSEC-2026-0459", reason = "fix needs libsqlite3-sys 0.39; blocked on sqlx; local-only attack on our own data folder" },
    # Unmaintained (not vulnerable) crates deep in iced's tree, with no
    # replacement we can pick ourselves. Accepted by Max 2026-11-17; review
    # by 2026-12-15 (issue #37). Vulnerabilities in them would still fail.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser via iced/cosmic-text font loading; no maintained replacement in iced 0.14" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz via iced/cosmic-text text shaping; no maintained replacement in iced 0.14" },
    { id = "RUSTSEC-2024-0436", reason = "paste, build-time macro helper pulled in by the wgpu stack" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant folded into zbus; clears when iced/rfd move to the merged zbus" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names folded into zbus; clears when iced/rfd move to the merged zbus" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive folded into zbus; clears when iced/rfd move to the merged zbus" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
]
confidence-threshold = 0.9
# The allow list is a policy, not an inventory; unused entries are fine.
unused-allowed-license = "allow"
# Mozilla's CA certificate list, bundled by ureq (used by the updater's
# Velopack). CDLA-Permissive-2.0 is a permissive data licence that puts no
# conditions on the program it ships in; allowed for this crate only.
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

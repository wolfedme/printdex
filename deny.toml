# cargo-deny configuration. Printdex is GPL-3.0-only, so every dependency
# must carry a GPL-3.0-compatible license.

[graph]
all-features = false

[advisories]
# Defaults: vulnerabilities and unsound crates are errors.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
]
confidence-threshold = 0.9
# The allow list is a policy, not an inventory; unused entries are fine.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

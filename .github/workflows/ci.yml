name: CI

# Branches (#109): feature PRs go into `dev` (the default branch); `main`
# only takes `dev` through a release PR, or a hotfix PR.
#
# Time budget: a PR stays under 5 minutes wall time (Max). The repo is
# public, so standard runners cost no minutes; what's slow or noisy is
# offloaded instead (#161):
# - PR into dev: Linux fmt + clippy + test, Windows test, macOS test and the
#   MSRV check, all in parallel.
# - Push to dev: the same jobs plus bench smoke. Its runs save the build
#   cache of every OS; PRs can only restore the default branch's, so this
#   is what keeps the Windows and macOS PR jobs fast.
# - PR into main: the same plus bench smoke. The Linux job is skipped for
#   the release PR (head `dev`), which dev's push already tested.
# - Push to main: nothing here; the PR tested that exact merge, and
#   release-tag.yml tags the release.
# - The release PR is opened by release-prepare.yml, whose token can't
#   trigger workflows, so it starts this workflow by hand on the release
#   commit (manual run = everything).
# - Weekly / manual: everything, on dev.
# - `ci: full` label on a PR into dev: bench smoke too.
# - Docs, Markdown and design-tooling-only changes run nothing.
# Dependency and licence checks live in deny.yml.

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - ".impeccable/**"
      - "LICENSE"
      - ".github/pull_request_template.md"
      - ".github/workflows/deny.yml"
  push:
    branches: [dev]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - ".impeccable/**"
      - "LICENSE"
      - ".github/pull_request_template.md"
      - ".github/workflows/deny.yml"
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

concurrency:
  # A new push to a PR cancels its older run. Adding an unrelated label gets its
  # own group, so it never cancels the real run.
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: always
  # No debug info: each test binary links iced, wgpu, rustic and OpenDAL,
  # and debug info doubled target/ (7 GB to 3.5 GB), the cache we save and
  # restore, and once filled the runner's disk. Panics still print file and
  # line. Incremental builds don't help a fresh runner.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: fmt + clippy + test (linux)
    # Skip on label events (the run that opened/updated the PR already did
    # this) and on the release PR, whose head dev's push already tested.
    if: >-
      github.event.action != 'labeled' &&
      !(github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          # A failing job would otherwise never save, and every later run
          # compiles from scratch (Windows did, 14 min at 2x, see #104).
          cache-on-failure: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # No doctests exist; examples are already checked by clippy.
      - run: cargo test --workspace --lib --bins --tests

  test-windows:
    name: test (windows)
    # Every run except label events (the run that opened/updated the PR
    # already tested that commit).
    if: &all-os github.event.action != 'labeled'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          cache-on-failure: true
      - run: cargo test --workspace --lib --bins --tests

  test-macos:
    name: test (macos)
    if: *all-os
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          cache-on-failure: true
      - run: cargo test --workspace --lib --bins --tests

  msrv:
    name: msrv
    if: *all-os
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2d81d658c8c4093152107cdb91c1e9545a9f992c # 1.94
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          cache-on-failure: true
      - run: cargo check --workspace --all-targets

  bench-smoke:
    name: bench smoke (20k parts)
    # Too slow and noisy for every PR: dev pushes, release PRs, weekly,
    # manual, or the `ci: full` label.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.action != 'labeled' &&
       github.base_ref == 'main') ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'ci: full') &&
       (github.event.action != 'labeled' || github.event.label.name == 'ci: full'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          cache-on-failure: true
      - name: Generate library
        run: cargo run --release -p printdex-cli -- bench gen "$RUNNER_TEMP/lib" --parts 20000
      - name: Benchmark
        # Exit 2 when an unchanged rescan reads file contents.
        run: |
          set -o pipefail
          echo '### printdex bench (20k parts)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo run --release -p printdex-cli -- bench run "$RUNNER_TEMP/lib" --idle-secs 30 --report bench-report.json | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Compare with budgets and baseline
        # Budgets (bench/baseline.json) always fail; regressions against the
        # recorded baseline fail once `enforce_regressions` is on.
        run: |
          set -o pipefail
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo run --release -p printdex-cli -- bench check bench-report.json | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bench-report
          path: bench-report.json